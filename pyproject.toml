[project]
name = "fitpet-navi-v2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pymysql>=1.2.0",
    "alembic>=1.19.1",
    "sqlalchemy>=2.0.52",
    "sqlalchemy-utc>=0.14.0",
    "pytz>=2026.3.post1",
    "tenacity>=9.1.4",
    "boto3 (>=1.43.85,<2.0.0)",
    "colorful-print>=1.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-env>=1.7.0",
    "ruff>=0.16.5",
    "testcontainers[mysql]>=4.15.0",
    "boto3-stubs (>=1.43.85,<2.0.0)",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# 기본값(E4/E7/E9/F) + I(import 정렬) — PyCharm의 ruff import optimizer와 CI 검사를 일치시킨다
select = ["E4", "E7", "E9", "F", "I"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
env = [

]
pythonpath = ['.']
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
