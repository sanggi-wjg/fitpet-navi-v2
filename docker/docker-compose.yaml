name: fitpet-navi-v2

services:
  mysql:
    image: mysql:8.0
    container_name: fitpet-navi-v2-mysql
    ports:
      - "6600:3306"
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=navi_v2
      - MYSQL_USER=navi_backend_app
      - MYSQL_PASSWORD=navi_backend_app_password
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 512M
